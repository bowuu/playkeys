<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playkeys for Plex Web</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 128 128" class="logo-svg">
            <rect x="4" y="4" width="120" height="120" rx="26" fill="#1c1e26" stroke="#e5a00d" stroke-width="6" />
            <polygon points="31,31 72,61 31,91" fill="#fbbf24" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round" />
            <rect x="88" y="28" width="12" height="66" rx="6" fill="#f8fafc" />
          </svg>
        </div>
        <span class="brand-name">Playkeys</span>
      </div>

      <div class="header-actions">
        <span id="connectionBadge" class="connection-badge disconnected" title="Connection status">
          <span class="status-dot"></span>
          <span class="status-label">Offline</span>
        </span>
        <button id="focusTabBtn" class="icon-btn" title="Focus Plex Tab" aria-label="Focus Plex Tab">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
        </button>
        <button id="optionsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Detected Unconfigured Server Banner -->
    <div id="unconfiguredBanner" class="detected-banner hidden">
      <div class="banner-text">
        <strong>Plex Server Detected</strong>
        <span id="detectedServerUrl" class="detected-url">http://localhost:32400</span>
      </div>
      <button id="btnGrantDetected" class="btn-banner-action">Connect</button>
    </div>

    <!-- Main Content Area: Active Player Card -->
    <main id="playerCard" class="player-card">
      <!-- Media Header Info: Artwork & Titles -->
      <div class="media-info-block">
        <div class="artwork-wrapper">
          <img id="trackArtwork" class="track-artwork hidden" alt="Album Art" />
          <div id="artworkPlaceholder" class="artwork-placeholder">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
        </div>

        <div class="meta-details">
          <div id="trackTitle" class="track-title" title="Track Title">Not Playing</div>
          <div id="trackArtist" class="track-artist" title="Artist">Plex Web Idle</div>
          <div id="trackAlbum" class="track-album" title="Album"></div>
        </div>
      </div>

      <!-- Scrubbable Timeline Seek Bar -->
      <div class="timeline-section">
        <div class="timeline-labels">
          <span id="currentTime" class="time-label">0:00</span>
          <span id="totalDuration" class="time-label">0:00</span>
        </div>
        <div class="seek-bar-wrapper">
          <input type="range" id="seekBar" class="seek-slider" min="0" max="100" value="0" step="0.1" aria-label="Seek timeline" />
        </div>
      </div>

      <!-- Single-Row Control Layout: Shuffle, Prev, Play/Pause, Next, Repeat -->
      <div class="single-row-controls">
        <!-- Shuffle -->
        <button id="btnShuffle" class="control-btn toggle-btn" title="Toggle Shuffle" aria-label="Toggle Shuffle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>

        <!-- Previous -->
        <button id="btnPrev" class="control-btn" title="Previous Track (MediaPrevTrack)" aria-label="Previous Track">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <!-- Play / Pause (Hero Circle) -->
        <button id="btnPlayPause" class="control-btn play-pause-hero" title="Play / Pause (MediaPlayPause)" aria-label="Play or Pause">
          <!-- Play icon -->
          <svg id="iconPlay" class="hero-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <!-- Pause icon -->
          <svg id="iconPause" class="hero-icon hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- Next -->
        <button id="btnNext" class="control-btn" title="Next Track (MediaNextTrack)" aria-label="Next Track">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>

        <!-- Repeat -->
        <button id="btnRepeat" class="control-btn toggle-btn" title="Toggle Repeat" aria-label="Toggle Repeat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
          <span id="repeatBadge" class="repeat-mode-badge hidden">1</span>
        </button>
      </div>

      <!-- Volume Bar -->
      <div class="volume-section">
        <button id="btnMute" class="icon-btn volume-toggle" title="Toggle Mute (Alt+Shift+M)" aria-label="Toggle Mute">
          <!-- Volume High -->
          <svg id="iconVolHigh" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <!-- Volume Muted -->
          <svg id="iconVolMuted" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>

        <div class="volume-slider-wrapper">
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume level" />
        </div>
        <span id="volumePercent" class="volume-percent">100%</span>
      </div>
    </main>

    <!-- Empty State View: No Plex Tab -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon-wrap">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="#E5A00D">
          <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
        </svg>
      </div>
      <h3 class="empty-title">No Plex Tab Found</h3>
      <p class="empty-subtitle">Launch Plex Web or connect a custom Plex Media Server to control playback with hotkeys.</p>
      
      <div class="empty-actions">
        <button id="openPlexWebBtn" class="btn-primary">Open Plex Web</button>
        <button id="openOptionsBtn" class="btn-secondary">Server Settings</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
